<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <table>
            <thead>
                <tr>
                    <th>Speaker</th>
                    <th>Title</th>
                    <th>Location</th>
                    <th>Year</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Alvin F. Meredith III</td>
                    <td>The Mission of BYU-Idaho</td>
                    <td>BYU-Idaho I-Center</td>
                    <td>2026</td>
                </tr>
                <tr>
                    <td>Rob Garrett</td>
                    <td>He Will Make More of You</td>
                    <td>BYU-Idaho I-Center</td>
                    <td>2026</td>
                </tr>
                <tr>
                    <td>James O. Fantone</td>
                    <td>The Battle is the Lords</td>
                    <td>BYU-Idaho I-Center</td>
                    <td>2026</td>
                </tr>
            </tbody>
        </table>
      </div>

      <div class = "form-box">
        <form action="#" method="post">
            <fieldset>
              <legend>Add Talk</legend>

              <section>
                <label for="speaker">Speaker:</label>
                <input type="text" id="speaker" name="speaker" required>
              </section>

              <section>
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>
              </section>

              <section>
                <label for="location">Location:</label>
                <input type="text" id="location" name="location" required>
              </section>

              <section>
                <label for="year">Year:</label>
                <input type="number" id="year" name="year" min="1900" max="2100" required>
              </section>

              <input class = "add-entry" type="submit" value="Add Entry">
          </fieldset>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
